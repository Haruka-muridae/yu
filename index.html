<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F6F3; --bg2: #EFEDE8; --ink: #1A1A18; --ink2: #3D3D39; --ink3: #7A7A74;
    --rule: #D8D5CE; --accent: #2D3A2E; --accent-light: #4A5E4C; --white: #FAFAF8;
    --mono: 'DM Mono', monospace; --serif: 'Shippori Mincho', 'DM Serif Display', serif;
    --sans: 'Noto Sans JP', sans-serif;
  }
  html { scroll-behavior: smooth; } 
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 300; line-height: 1.8; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; background: rgba(247,246,243,0.88); backdrop-filter: blur(12px); border-bottom: 1px solid var(--rule); }
  .nav-logo { font-family: var(--serif); font-size: 22px; font-weight: 500; letter-spacing: 0.05em; color: var(--ink); text-decoration: none; }
  .nav-links { display: flex; gap: 32px; list-style: none; }
  .nav-links a { font-family: var(--mono); font-size: 11px; font-weight: 300; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink3); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--ink); }
  section { padding: 100px 0; }
  .container { max-width: 900px; margin: 0 auto; padding: 0 40px; }
  .section-label { font-family: var(--mono); font-size: 10px; font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink3); margin-bottom: 48px; display: flex; align-items: center; gap: 16px; }
  .section-label::after { content: ''; display: block; width: 40px; height: 1px; background: var(--ink3); }
  #hero { min-height: 90vh; display: flex; flex-direction: column; justify-content: flex-end; padding-top: 80px; padding-bottom: 80px; background: var(--bg); position: relative; overflow: hidden; }
  .hero-grid { max-width: 900px; margin: 0 auto; padding: 0 40px; display: grid; grid-template-columns: 1fr 280px; gap: 60px; align-items: end; }
  .hero-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink3); margin-bottom: 24px; }
  .hero-headline { font-family: var(--serif); font-size: clamp(36px, 5vw, 56px); line-height: 1.35; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 28px; }
  .hero-sub { font-size: 15px; line-height: 1.85; color: var(--ink2); max-width: 520px; margin-bottom: 48px; }
  .hero-cta-group { display: flex; gap: 16px; flex-wrap: wrap; }
  .btn-primary { display: inline-block; padding: 14px 32px; background: var(--accent); color: var(--white); font-family: var(--sans); font-size: 13px; font-weight: 500; letter-spacing: 0.05em; text-decoration: none; cursor: pointer; border: none; transition: background 0.25s, transform 0.2s; }
  .btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); }
  .btn-outline { display: inline-block; padding: 14px 32px; border: 1px solid var(--ink); color: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 400; letter-spacing: 0.05em; text-decoration: none; cursor: pointer; background: transparent; transition: background 0.25s, color 0.25s; }
  .btn-outline:hover { background: var(--ink); color: var(--white); }
  .photo-frame { width: 100%; aspect-ratio: 3/4; background: var(--bg2); border: 1px solid var(--rule); overflow: hidden; position: relative; }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--ink3); font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; }
  .photo-placeholder-icon { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--rule); background: var(--bg); display: flex; align-items: center; justify-content: center; }
  #profile { background: var(--bg2); }
  .profile-inner { display: grid; grid-template-columns: 1fr 1.6fr; gap: 80px; align-items: start; }
  .profile-name-block { position: sticky; top: 120px; }
  .profile-name { font-family: var(--serif); font-size: 48px; line-height: 1.2; color: var(--ink); margin-bottom: 8px; }
  .profile-name-en { font-family: var(--mono); font-size: 12px; letter-spacing: 0.15em; color: var(--ink3); text-transform: uppercase; }
  .profile-divider { width: 32px; height: 1px; background: var(--accent); margin: 24px 0; }
  .profile-tags { display: flex; flex-direction: column; gap: 8px; }
  .profile-tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--ink3); text-transform: uppercase; }
  .profile-text { font-size: 15px; line-height: 2; color: var(--ink2); }
  .profile-text p { margin-bottom: 20px; }
  .profile-text p:last-child { margin-bottom: 0; }

  /* ── Philosophy（理念 = なぜやるか） ── */
  #philosophy { background: var(--bg); }
  .philosophy-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  .philo-card { padding: 0; }
  .philo-num { font-family: var(--mono); font-size: 48px; font-weight: 300; color: var(--rule); line-height: 1; margin-bottom: 24px; }
  .philo-title { font-family: var(--serif); font-size: 18px; color: var(--ink); margin-bottom: 12px; }
  .philo-text { font-size: 13px; line-height: 1.9; color: var(--ink3); }

  /* ── Approach（取り組み = どう支援するか / 旧 Activities + Value を統合） ── */
  #approach { background: var(--accent); color: var(--white); }
  #approach .section-label { color: rgba(255,255,255,0.4); }
  #approach .section-label::after { background: rgba(255,255,255,0.3); }
  .value-headline { font-family: var(--serif); font-size: clamp(28px, 4vw, 44px); line-height: 1.45; color: var(--white); margin-bottom: 60px; }
  .value-list { display: flex; flex-direction: column; gap: 0; }
  .value-item { padding: 28px 0; border-top: 1px solid rgba(255,255,255,0.15); display: grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: start; }
  .value-item:last-child { border-bottom: 1px solid rgba(255,255,255,0.15); }
  .value-label { font-family: var(--serif); font-size: 18px; letter-spacing: 0.02em; color: var(--white); padding-top: 1px; }
  .value-desc { font-size: 14.5px; line-height: 1.85; color: rgba(255,255,255,0.85); }

  /* ── Services（提供サービス = 主役。前方に配置） ── */
  #services { background: var(--bg); }
  .services-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 48px; }
  .services-note { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--ink3); text-transform: uppercase; }
  .services-list { display: flex; flex-direction: column; gap: 2px; }
  .service-row { background: var(--white); padding: 36px 40px; display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: center; cursor: pointer; transition: background 0.2s; text-decoration: none; color: inherit; }
  .service-row:hover { background: var(--bg2); }
  .service-title { font-family: var(--serif); font-size: 20px; color: var(--ink); margin-bottom: 8px; }
  .service-desc { font-size: 13px; color: var(--ink3); line-height: 1.7; }
  .service-arrow { font-family: var(--mono); font-size: 18px; color: var(--ink3); transition: transform 0.2s; flex-shrink: 0; }
  .service-row:hover .service-arrow { transform: translateX(4px); }
  .services-coming { margin-top: 40px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--ink3); text-align: center; text-transform: uppercase; }

  /* ── Results（数字の実績） ── */
  #highlights { background: var(--bg2); }
  .highlights-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--rule); }
  .highlight-card { background: var(--white); padding: 44px 40px; display: flex; flex-direction: column; gap: 12px; }
  .highlight-figure { display: flex; align-items: baseline; gap: 4px; }
  .highlight-num { font-family: var(--serif); font-size: clamp(44px, 5vw, 64px); line-height: 1; color: var(--accent); letter-spacing: -0.02em; }
  .highlight-unit { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--ink3); text-transform: uppercase; }
  .highlight-title { font-family: var(--serif); font-size: 16px; color: var(--ink); line-height: 1.5; }
  .highlight-desc { font-size: 12.5px; line-height: 1.85; color: var(--ink3); }

  /* ── Timeline（経歴 = 全件） ── */
  #timeline { background: var(--bg2); }
  .timeline-list { position: relative; padding-left: 28px; }
  .timeline-list::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: var(--rule); }
  .timeline-item { position: relative; padding: 0 0 52px 44px; }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-dot { position: absolute; left: -32px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg2); box-shadow: 0 0 0 1px var(--accent); }
  .timeline-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .timeline-year { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; color: var(--accent); font-weight: 400; }
  .timeline-category { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink3); background: var(--bg); padding: 3px 8px; }
  .timeline-title { font-family: var(--serif); font-size: 18px; color: var(--ink); margin-bottom: 8px; line-height: 1.4; }
  .timeline-desc { font-size: 13.5px; line-height: 1.9; color: var(--ink2); }

  /* ── Links（SNS / 発信） ── */
  #sns-hobby { background: var(--bg); }
  .sns-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .sns-card { display: flex; flex-direction: column; justify-content: space-between; padding: 28px 28px 24px; background: var(--white); border: 1px solid var(--rule); text-decoration: none; color: inherit; position: relative; overflow: hidden; transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s; min-height: 160px; }
  .sns-card::before { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease; }
  .sns-card:hover { border-color: transparent; transform: translateY(-3px); box-shadow: 0 8px 32px rgba(0,0,0,0.07); }
  .sns-card:hover::before { transform: scaleX(1); }
  .sns-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
  .sns-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sns-icon svg { width: 22px; height: 22px; fill: var(--ink3); transition: fill 0.2s; }
  .sns-card:hover .sns-icon svg { fill: var(--accent); }
  .sns-tag { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink3); background: var(--bg2); padding: 4px 8px; border-radius: 2px; }
  .sns-card-title { font-family: var(--serif); font-size: 16px; color: var(--ink); margin-bottom: 6px; line-height: 1.4; }
  .sns-card-handle { font-family: var(--mono); font-size: 11px; color: var(--ink3); letter-spacing: 0.06em; }
  .sns-card-arrow { position: absolute; bottom: 20px; right: 24px; font-family: var(--mono); font-size: 14px; color: var(--rule); transition: color 0.2s, transform 0.2s; }
  .sns-card:hover .sns-card-arrow { color: var(--accent); transform: translate(3px, -3px); }
  #contact { background: var(--ink); color: var(--white); }
  #contact .section-label { color: rgba(255,255,255,0.35); }
  #contact .section-label::after { background: rgba(255,255,255,0.25); }
  .contact-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
  .contact-headline { font-family: var(--serif); font-size: clamp(28px, 4vw, 44px); line-height: 1.4; color: var(--white); margin-bottom: 24px; }
  .contact-body { font-size: 14px; line-height: 1.9; color: rgba(255,255,255,0.6); margin-bottom: 40px; }
  .contact-form { display: flex; flex-direction: column; gap: 20px; }
  .form-field { display: flex; flex-direction: column; gap: 8px; }
  .form-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
  .form-input, .form-textarea { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); color: var(--white); padding: 14px 16px; font-family: var(--sans); font-size: 14px; font-weight: 300; outline: none; transition: border-color 0.2s; width: 100%; resize: none; }
  .form-input::placeholder, .form-textarea::placeholder { color: rgba(255,255,255,0.2); }
  .form-input:focus, .form-textarea:focus { border-color: rgba(255,255,255,0.4); }
  .form-textarea { min-height: 140px; }
  .btn-white { display: inline-block; padding: 16px 36px; background: var(--white); color: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 500; letter-spacing: 0.05em; border: none; cursor: pointer; transition: opacity 0.2s, transform 0.2s; align-self: flex-start; }
  .btn-white:hover { opacity: 0.85; transform: translateY(-1px); }
  .site-footer-wrap { background: #1A1A18; }
  .site-footer { max-width: 900px; margin: 0 auto; padding: 32px 40px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; }
  .footer-name { font-family: var(--serif); font-size: 16px; color: rgba(255,255,255,0.5); }
  .footer-copy { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: rgba(255,255,255,0.25); text-transform: uppercase; }
  @media (max-width: 768px) {
    nav { padding: 16px 24px; }
    .nav-links { display: none; }
    .hero-grid { grid-template-columns: 1fr; gap: 40px; padding: 0 24px; }
    .photo-frame { max-width: 200px; aspect-ratio: 1/1; border-radius: 50%; }
    .container { padding: 0 24px; }
    section { padding: 72px 0; }
    .profile-inner { grid-template-columns: 1fr; gap: 40px; }
    .profile-name-block { position: static; }
    .highlights-grid { grid-template-columns: 1fr; }
    .value-item { grid-template-columns: 1fr; gap: 8px; }
    .philosophy-grid { grid-template-columns: 1fr; gap: 36px; }
    .contact-inner { grid-template-columns: 1fr; gap: 48px; }
    .services-header { flex-direction: column; gap: 8px; }
    .service-row { padding: 28px 24px; }
    .site-footer { padding: 24px; flex-direction: column; gap: 8px; text-align: center; }
    .sns-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .timeline-list { padding-left: 16px; }
    .timeline-item { padding-left: 32px; }
    .timeline-dot { left: -20px; }
  }
  @media (max-width: 480px) {
    .sns-grid { grid-template-columns: 1fr; }
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up   { animation: fadeUp 0.7s ease both; }
  .fade-up-2 { animation: fadeUp 0.7s 0.15s ease both; }
  .fade-up-3 { animation: fadeUp 0.7s 0.30s ease both; }
  .fade-up-4 { animation: fadeUp 0.7s 0.45s ease both; }
</style>
</head>

function Contact() {
  const [form, setForm] = useState({ name: "", email: "", message: "", _hp: "" });
  const [status, setStatus] = useState(null);
  const handleSubmit = async () => {
    if (form._hp) { setStatus("sent"); return; }
    if (!form.name || !form.email || !form.message) { setStatus("error"); return; }
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(form.email)) { setStatus("error"); return; }
    if (form.name.length > 100 || form.message.length > 2000) { setStatus("error"); return; }
    setStatus("sending");
    try {
      await fetch(CONTACT_ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: form.name, email: form.email, message: form.message }) });
      setStatus("sent");
      setForm({ name: "", email: "", message: "", _hp: "" });
    } catch {
      setStatus("error");
    }
  };
  return (
    <section id="contact">
      <div className="container">
        <div className="section-label">Contact</div>
        <div className="contact-inner">
          <div>
            <h2 className="contact-headline">まずは、<br/>相談から。</h2>
            <p className="contact-body">サービス内容のご質問、<br/>具体的なご相談、どちらも歓迎です。<br/><br/>正式な依頼でなくても構いません。<br/>「こういうことで困っている」という段階で<br/>ご連絡いただければ十分です。</p>
          </div>
          <div>
            {status === "sent" ? (
              <div style={{ padding: "40px 0", color: "rgba(255,255,255,0.7)", fontFamily: "var(--mono)", fontSize: 13, letterSpacing: "0.1em" }}>
                ✓ 送信が完了しました。<br/><span style={{ fontSize: 11, opacity: 0.5 }}>数日以内にご連絡します。</span>
              </div>
            ) : (
              <div className="contact-form">
                <div style={{ display: "none" }} aria-hidden="true">
                  <input tabIndex="-1" autoComplete="off" value={form._hp} onChange={e => setForm({ ...form, _hp: e.target.value })} />
                </div>
                <div className="form-field">
                  <label className="form-label">お名前</label>
                  <input className="form-input" placeholder="山田 太郎" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
                </div>
                <div className="form-field">
                  <label className="form-label">メールアドレス</label>
                  <input className="form-input" type="email" placeholder="your@email.com" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
                </div>
                <div className="form-field">
                  <label className="form-label">ご相談内容</label>
                  <textarea className="form-textarea" placeholder="現状や悩んでいることを、気軽に書いてください。" value={form.message} onChange={e => setForm({ ...form, message: e.target.value })} />
                </div>
                {status === "error" && (
                  <p style={{ fontFamily: "var(--mono)", fontSize: 11, color: "#ff8888" }}>入力内容を確認してください（メールアドレスの形式・必須項目をご確認ください）</p>
                )}
                <button className="btn-white" onClick={handleSubmit} disabled={status === "sending"}>
                  {status === "sending" ? "送信中..." : "送信する"}
                </button>
              </div>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}
